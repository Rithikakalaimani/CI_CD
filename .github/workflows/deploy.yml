# Deploy to GitHub Pages — build Vite app, then deploy
# Triggers on index.html, lighthouserc.json, src, or package files
# See README for setup and repository settings

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "lighthouserc.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "vite.config.js"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "lighthouserc.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "vite.config.js"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML (W3C Nu Validator)
        run: |
          RESP=$(curl -sS -H "Content-Type: text/html; charset=utf-8" \
            --data-binary @index.html \
            "https://validator.nu/?out=json")
          ERRORS=$(echo "$RESP" | jq -r '[.messages[]? | select(.type == "error")] | length')
          if [ "$ERRORS" != "0" ]; then
            echo "$RESP" | jq -r '.messages[]? | select(.type == "error") | "\(.message)"'
            echo "HTML validation failed with $ERRORS error(s)"
            exit 1
          fi
          echo "HTML validation passed (0 errors)"

      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--root-dir ${{ github.workspace }} index.html"
          fail: true
          failIfEmpty: false
          jobSummary: false

  build:
    name: Build app
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: |
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          echo "duration=$((END - START))" >> "$GITHUB_OUTPUT"

      - name: Generate deployment metadata
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_SECS="${{ steps.build.outputs.duration }}"
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"deployedAt\":\"${DEPLOYED_AT}\",\"sha\":\"${{ github.sha }}\",\"shortSha\":\"${SHORT_SHA}\",\"buildDurationSeconds\":${BUILD_SECS},\"checksPassed\":3}" > dist/version.json
          cat dist/version.json

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [validate, build, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: github-pages
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Pages to be live
        run: sleep 45

      - name: Smoke test — availability and critical content
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Checking $PAGES_URL"
          HTTP=$(curl -sS -o /tmp/body -w "%{http_code}" --connect-timeout 15 --max-time 30 "$PAGES_URL")
          if [ "$HTTP" != "200" ]; then
            echo "Expected HTTP 200, got $HTTP"
            exit 1
          fi
          echo "HTTP $HTTP OK"
          if ! grep -q "Pipeline Shrine" /tmp/body; then
            echo "Expected critical content 'Pipeline Shrine' not found in response"
            exit 1
          fi
          echo "Critical content found — smoke test passed"
