# Blue-green deployment — deploy to inactive slot, then switch when ready
# Requires: Pages set to "Deploy from branch" → branch gh-pages-content
# See README "Blue-green deployment" section

name: Blue-green deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "lighthouserc.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "vite.config.js"
      - ".blue-green/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Only run when blue-green is enabled (active.txt exists)
  check:
    name: Check blue-green mode
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.out.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        run: |
          if [ -f .blue-green/active.txt ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build-inactive:
    name: Build for inactive slot
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.enabled == 'true'
    outputs:
      active: ${{ steps.slot.outputs.active }}
      inactive: ${{ steps.slot.outputs.inactive }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - id: slot
        run: |
          ACTIVE=$(cat .blue-green/active.txt 2>/dev/null || echo "blue")
          if [ "$ACTIVE" = "blue" ]; then
            echo "active=blue" >> "$GITHUB_OUTPUT"
            echo "inactive=green" >> "$GITHUB_OUTPUT"
          else
            echo "active=green" >> "$GITHUB_OUTPUT"
            echo "inactive=blue" >> "$GITHUB_OUTPUT"
          fi
      - name: Build for inactive slot
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/${{ steps.slot.outputs.inactive }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build
      - name: Generate version.json
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "{\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"sha\":\"${{ github.sha }}\",\"shortSha\":\"${SHORT_SHA}\",\"slot\":\"${{ steps.slot.outputs.inactive }}\"}" > dist/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: inactive-slot-build
          path: dist/

  deploy-slots:
    name: Deploy to inactive slot
    runs-on: ubuntu-latest
    needs: [check, build-inactive]
    if: needs.check.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: slot
        run: |
          ACTIVE=$(cat .blue-green/active.txt 2>/dev/null || echo "blue")
          if [ "$ACTIVE" = "blue" ]; then
            echo "active=blue" >> "$GITHUB_OUTPUT"
            echo "inactive=green" >> "$GITHUB_OUTPUT"
          else
            echo "active=green" >> "$GITHUB_OUTPUT"
            echo "inactive=blue" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch or create gh-pages-content
        run: |
          git fetch origin gh-pages-content:refs/remotes/origin/gh-pages-content 2>/dev/null || true
          if git show-ref --verify refs/remotes/origin/gh-pages-content >/dev/null 2>&1; then
            git checkout -B gh-pages-content origin/gh-pages-content
          else
            git checkout --orphan gh-pages-content
            git reset --hard
          fi
      - uses: actions/download-artifact@v4
        with:
          name: inactive-slot-build
      - name: Update inactive slot
        run: |
          INACTIVE="${{ steps.slot.outputs.inactive }}"
          if [ ! -d blue ] || [ ! -d green ]; then
            mkdir -p blue green
            cp -r inactive-slot-build/* blue/
            cp -r inactive-slot-build/* green/
          else
            rm -rf "$INACTIVE"
            mkdir -p "$INACTIVE"
            cp -r inactive-slot-build/* "$INACTIVE"/
          fi
      - name: Write redirect to active
        run: |
          ACTIVE="${{ steps.slot.outputs.active }}"
          REPO="${{ github.event.repository.name }}"
          cat > index.html << EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/${REPO}/${ACTIVE}/"></head><body>Redirecting to <a href="/${REPO}/${ACTIVE}/">${ACTIVE}</a>...</body></html>
          EOF
      - name: Push to gh-pages-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy to ${{ steps.slot.outputs.inactive }} slot (blue-green)"
          git push origin HEAD:gh-pages-content
